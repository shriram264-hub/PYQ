services:
  - type: web
    name: upsc-pyq-search-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ALLOWED_ORIGINS
        value: https://upsc-pyq-search-s778.onrender.com,http://localhost:5173

  - type: web
    name: upsc-pyq-search
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://upsc-pyq-search-api.onrender.com
