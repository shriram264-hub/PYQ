services:
  - type: web
    name: upsc-pyq-search-api
    runtime: python
    plan: free
    rootDir: backend
    # The API reads ../data at startup, which sits outside rootDir, so without
    # this a data-only commit would never redeploy it and search would keep
    # serving the old corpus.
    buildFilter:
      paths:
        - backend/**
        - data/questions.json
        - data/embeddings.npy
    # The second step downloads the embedding model into backend/model-cache,
    # so it ships with the deploy rather than being fetched again (65 MB) by
    # the first search after every restart.
    buildCommand: pip install -r requirements.txt && python -c "from app.search import warm_model; warm_model()"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      # Every origin that serves the site: the domain, the old Render address
      # (still live, so old links keep searching) and local dev servers.
      - key: ALLOWED_ORIGINS
        value: https://sawaalbox.in,https://upsc-pyq-search-s778.onrender.com,http://localhost:4321,http://localhost:5173

  - type: web
    name: upsc-pyq-search
    runtime: static
    # The Astro site in site/ replaces the old single-page app in frontend/.
    # Same service, so the public URL and the backend's CORS allowlist are
    # unchanged. Reverting is this one value.
    rootDir: site
    # The site builds every page from ../data/questions.json, outside rootDir,
    # and a forwarding page for each old address in ../data/legacy-urls.json.
    # A data change that removes or re-creates a subject or topic page must
    # update legacy-urls.json in the same commit, or check-links fails the build.
    buildFilter:
      paths:
        - site/**
        - data/questions.json
        - data/legacy-urls.json
    buildCommand: npm install && npm run build && node scripts/check-links.mjs
    staticPublishPath: dist
    envVars:
      # Baked into the client at build time; the search island calls this.
      - key: PUBLIC_API_BASE
        value: https://upsc-pyq-search-api.onrender.com
      # Canonical origin for canonical tags, OG urls and the sitemap. The domain
      # is attached to this service in Render (www redirects to it).
      - key: SITE_URL
        value: https://sawaalbox.in
      # Supabase project for accounts. The publishable key is public by design:
      # it ships in the client bundle, and row-level security does the guarding.
      - key: PUBLIC_SUPABASE_URL
        value: https://fcmwzpokqufvkojcqaxo.supabase.co
      - key: PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_9gqFXj_3dIbp3Mun5I3Lvg_533uA-r3
      # Sign-in providers the site shows; empty hides Sign in everywhere. Google
      # is enabled in Supabase with its OAuth client published to production.
      - key: PUBLIC_AUTH_PROVIDERS
        value: google
