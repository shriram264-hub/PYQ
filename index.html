<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC PYQ Search</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #e4e2da; --accent: #2f5d50; --accent-soft: #e3eee9;
    --correct: #1f7a4d; --correct-bg: #e5f4ec; --warn: #9a5b00; --warn-bg: #fdf1dc;
    --bad: #a1322b; --bad-bg: #fbe7e5; --mark: #fff0a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1e1f1c; --ink: #ecebe6; --muted: #9c9b94;
      --line: #33342f; --accent: #8cc5b1; --accent-soft: #24332d;
      --correct: #7fd3a6; --correct-bg: #1c3127; --warn: #f0bd6a; --warn-bg: #3a2e18;
      --bad: #f0958d; --bad-bg: #3a201e; --mark: #5a4d10;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .searchbar { display: flex; gap: 8px; }
  .searchbar input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  .searchbar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 10px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 14px 0 6px;
             font-size: 13px; color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 6px; }
  .filters select, .filters input[type=number] { font: inherit; font-size: 13px; padding: 5px 6px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); }
  .filters input[type=number] { width: 72px; }

  .examples { font-size: 13px; color: var(--muted); margin: 8px 0 18px; }
  .examples a { color: var(--accent); cursor: pointer; margin-right: 10px; text-decoration: none;
                border-bottom: 1px dotted var(--accent); }

  .summary { font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
  .years { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
  .years span { font-size: 12px; background: var(--accent-soft); color: var(--accent);
                padding: 2px 8px; border-radius: 999px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px;
          color: var(--muted); margin-bottom: 8px; }
  .meta b { color: var(--ink); }
  .pill { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .pill.easy { color: var(--correct); } .pill.moderate { color: var(--warn); } .pill.difficult { color: var(--bad); }
  .pill.cancelled { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .pill.disputed { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .match { margin-left: auto; }
  .q { white-space: pre-wrap; margin: 0 0 10px; }
  .opts { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .opts li { padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; }
  .reveal .opts li.right { background: var(--correct-bg); color: var(--correct); font-weight: 600; }
  .note { font-size: 13px; margin-top: 8px; color: var(--muted); display: none; }
  .reveal .note { display: block; }
  .card .toggle { font-size: 12.5px; padding: 4px 10px; margin-top: 10px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 560px) { .match { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>UPSC Prelims PYQ Search</h1>
  <p class="sub" id="sub">Search past questions by concept, not just exact words.</p>

  <form class="searchbar" id="form">
    <input id="q" type="search" placeholder="e.g. Harappan civilisation, Ramsar wetlands, money bill…" autofocus>
    <button class="primary" type="submit">Search</button>
  </form>

  <div class="filters">
    <label>Subject <select id="subject"><option value="">All</option></select></label>
    <label>Years <input id="min_year" type="number"> – <input id="max_year" type="number"></label>
    <label>Difficulty
      <select id="difficulty">
        <option value="">All</option><option>easy</option><option>moderate</option><option>difficult</option>
      </select></label>
    <label>Show <select id="top"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
    <label><input id="showAnswers" type="checkbox"> Show all answers</label>
  </div>

  <div class="examples">Try:
    <a>Harappan civilisation</a><a>Fundamental Rights</a><a>El Nino and monsoon</a>
    <a>Buddhist councils</a><a>inflation targeting RBI</a><a>tiger reserves</a>
  </div>

  <div id="out"><p class="empty">Type a topic to search, or pick filters and search with an empty box to browse.</p></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastQuery = "";

// Highlight the searched words in the text (after escaping it)
function highlight(text) {
  const words = lastQuery.toLowerCase().match(/[a-z0-9]{3,}/g) || [];
  let html = esc(text);
  for (const w of new Set(words)) {
    html = html.replace(new RegExp(`\\b(${w}\\w*)`, "gi"), "<mark>$1</mark>");
  }
  return html;
}

async function loadMeta() {
  const m = await (await fetch("/api/meta")).json();
  $("sub").textContent = `${m.count.toLocaleString()} UPSC Prelims questions, ${m.min_year}–${m.max_year}. Search by concept, not just exact words.`;
  for (const s of m.subjects) $("subject").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`);
  $("min_year").value = m.min_year; $("max_year").value = m.max_year;
  $("min_year").min = $("max_year").min = m.min_year;
  $("min_year").max = $("max_year").max = m.max_year;
}

function card(q) {
  const status = q.status === "cancelled" ? `<span class="pill cancelled">Cancelled by UPSC</span>`
               : q.status === "disputed" ? `<span class="pill disputed">Answer disputed</span>` : "";
  const opts = ["a","b","c","d"].map(k =>
    `<li class="${q.answer === k ? "right" : ""}">(${k}) ${highlight(q[k])}</li>`).join("");
  const note = q.answer_note ? `<div class="note">Note: ${esc(q.answer_note)}</div>` : "";
  return `<div class="card${$("showAnswers").checked ? " reveal" : ""}">
    <div class="meta"><b>UPSC ${q.year} · Q${q.q_no}</b>
      <span>${esc(q.subject)} › ${esc(q.subtopic)}</span>
      <span class="pill ${q.difficulty}">${q.difficulty}</span>${status}
      ${lastQuery ? `<span class="match">match ${Math.round(q.score * 100)}%</span>` : ""}</div>
    <p class="q">${highlight(q.question)}</p>
    <ul class="opts">${opts}</ul>${note}
    <button class="toggle" type="button">Show / hide answer</button>
  </div>`;
}

async function run() {
  lastQuery = $("q").value.trim();
  const p = new URLSearchParams({ q: lastQuery, subject: $("subject").value,
    min_year: $("min_year").value, max_year: $("max_year").value,
    difficulty: $("difficulty").value, top: $("top").value });
  $("out").innerHTML = `<p class="empty">Searching…</p>`;
  try {
    const r = await (await fetch("/api/search?" + p)).json();
    if (r.error) throw new Error(r.error);
    if (!r.results.length) { $("out").innerHTML = `<p class="empty">No questions match these filters.</p>`; return; }
    const years = Object.entries(r.years_in_results).map(([y, n]) => `<span>${y} × ${n}</span>`).join("");
    $("out").innerHTML =
      `<div class="summary">${lastQuery ? `Top ${r.results.length} matches for “${esc(lastQuery)}”` : `Showing ${r.results.length}`}
         from ${r.total_filtered.toLocaleString()} questions in range. Years in these results:</div>
       <div class="years">${years}</div>` + r.results.map(card).join("");
  } catch (e) {
    $("out").innerHTML = `<p class="empty">Something went wrong: ${esc(e.message)}. Is app.py still running?</p>`;
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); run(); });
for (const id of ["subject", "difficulty", "top", "min_year", "max_year"]) $(id).addEventListener("change", run);
$("showAnswers").addEventListener("change", () =>
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("reveal", $("showAnswers").checked)));
$("out").addEventListener("click", e => { if (e.target.classList.contains("toggle")) e.target.closest(".card").classList.toggle("reveal"); });
document.querySelectorAll(".examples a").forEach(a => a.addEventListener("click", () => { $("q").value = a.textContent; run(); }));
loadMeta();
</script>
</body>
</html>
